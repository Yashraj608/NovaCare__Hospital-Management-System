<div style="padding: 4rem 2rem; text-align: center; background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);">
    <i class="fa-solid {{ icon }}" style="font-size: 3.5rem; color: #c8d3de; margin-bottom: 1.2rem; display: block;"></i>
    <h3 style="color: #555; margin-bottom: 0.5rem;">{{ title }}</h3>
    <p style="color: #aaa; font-size: 0.95rem;">{{ text }}</p>
</div>
