{% extends 'base.html' %}
{% block title %}Login - NovaCare{% endblock %}

{% block content %}
<section style="padding: 6rem 2rem; background: var(--bg-light); min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="container reveal" style="max-width: 500px; width: 100%;">
        <div style="background: white; padding: 3rem; border-radius: 16px; box-shadow: var(--shadow-lg);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <i class="fa-solid fa-right-to-bracket" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                <h2 style="color: var(--primary-dark); font-size: 2rem;">Welcome Back</h2>
                <p style="color: var(--text-muted);">Log in to access your NovaCare dashboard.</p>
            </div>
            
            {% if error %}
            <div style="background: #f8dbdf; color: var(--danger); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'accounts:login' %}" style="display: flex; flex-direction: column; gap: 1.5rem;" autocomplete="off">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required style="padding: 1rem; border-radius: 8px; border: 1px solid #ccc; width: 100%; font-size: 1rem;" autocomplete="off">
                <input type="password" name="password" placeholder="Password" required style="padding: 1rem; border-radius: 8px; border: 1px solid #ccc; width: 100%; font-size: 1rem;" autocomplete="new-password">
                
                <button type="submit" class="btn btn-primary" style="padding: 1rem; font-size: 1.1rem; border-radius: 8px; margin-top: 1rem;">Log In</button>
            </form>
            <p style="text-align: center; margin-top: 2rem; color: var(--text-muted);">Don't have an account? <a href="{% url 'accounts:register' %}" style="color: var(--primary-color); font-weight: 600;">Register here</a></p>
        </div>
    </div>
</section>
{% endblock %}
