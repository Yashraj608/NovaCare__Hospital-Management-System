{% extends 'base.html' %}
{% block title %}Confirm Delete - NovaCare{% endblock %}

{% block content %}
<section class="page-header" style="background: var(--danger); color: white; padding: 2rem; text-align: center;">
    <h1>Confirm Delete</h1>
</section>

<section style="padding: 4rem 2rem; background: var(--bg-light); min-height: 50vh;">
    <div class="container" style="max-width: 500px; background: white; border-radius: 12px; padding: 2rem; box-shadow: var(--shadow-sm); text-align: center;">
        <h3 style="margin-bottom: 1.5rem;">Are you sure you want to delete "{{ object.name }}"?</h3>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn" style="background: var(--danger); color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 6px; cursor: pointer;">Yes, Delete</button>
            <a href="{% url 'pharmacy:medicine_list' %}" class="btn" style="background: #e2e8f0; color: #475569; padding: 0.8rem 1.5rem; text-decoration: none; border-radius: 6px; margin-left: 1rem;">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
